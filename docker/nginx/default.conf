# 1. HTTP Server - Redirect all traffic to HTTPS
server {
    listen 80;
    server_name _; # Replace _ with your domain name (e.g., example.com) if available
    return 301 https://$host$request_uri;
}

# 2. HTTPS Server - Handle encrypted traffic
server {
    listen 443 ssl;
    server_name _; # Replace _ with your domain name (e.g., example.com) if available

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # SSL Certificate Configuration
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Secure SSL Protocols and Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Ensure Laravel knows the request originated via HTTPS
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_SCHEME https;

        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.ht {
        deny all;
    }
}
