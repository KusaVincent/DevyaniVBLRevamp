# Map block for dynamic WebSocket connection upgrading (Must be in http context or top of file)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. Default Fallback Server - Drop Direct IP Scans & Unrecognized Host Headers
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    server_name _;
    return 444; # Drop connection immediately
}

# 2. Global HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name 192.168.127.129; # Replace with your FQDN in production

    server_tokens off;
    return 301 https://$host$request_uri;
}

# 3. Hardened Production Server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on; # Nginx >= 1.25.1. Use 'listen 443 ssl http2;' for older versions.

    server_name 192.168.127.129; # Replace with your FQDN in production

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64M;
    server_tokens off;

    # SSL Certificates
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern TLS Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; script-src 'self' http: https: 'unsafe-inline' 'unsafe-eval' blob:; " always;

    # Nginx health check
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # Laravel Front Controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Portainer
    location = /portainer {
        return 301 /portainer/;
    }

    location /portainer/ {
        proxy_pass http://portainer:9000/;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /portainer;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_buffering off;

        proxy_redirect / /portainer/;
    }

    # Optimization for static queries
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Portainer timeout page
    location = /timeout.html {
        proxy_pass http://portainer:9000/timeout.html;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /portainer;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_buffering off;
    }

    # FastCGI PHP Handler with Real IP Headers
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Forward true client IP and request metadata to Laravel
        fastcgi_param HTTP_X_REAL_IP        $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR  $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_PORT $server_port;

        fastcgi_param HTTPS on;
        fastcgi_param HTTP_SCHEME https;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Block access to hidden files (.env, .git, etc.) except Let's Encrypt validation
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
