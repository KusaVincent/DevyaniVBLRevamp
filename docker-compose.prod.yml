services:
    app:
        image: mpesa_middleware:1.0
        container_name: mpesa_middleware
        restart: always
        environment:
            DB_PORT: ${DB_PORT}
            DB_HOST: ${DB_HOST}
            APP_ENV: ${APP_ENV}
            APP_DEBUG: ${APP_DEBUG}
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_CONNECTION: ${DB_CONNECTION}
            QUEUE_CONNECTION: ${QUEUE_CONNECTION}
            REDIS_HOST: ${REDIS_HOST}
            REDIS_PORT: ${REDIS_PORT}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
        volumes:
            - storage_data:/var/www/html/storage
            - /opt/devyanivbl/.env:/var/www/html/.env:ro
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "php artisan status || php artisan --version || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        networks:
            - frontend-network
            - backend-network

    scheduler:
        image: mpesa_middleware:1.0
        container_name: mpesa_scheduler
        restart: always
        command:
            - php
            - artisan
            - schedule:work
        volumes:
            - storage_data:/var/www/html/storage
            - /opt/devyanivbl/.env:/var/www/html/.env:ro
        depends_on:
            app:
                condition: service_healthy
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f 'schedule:work' || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 5s
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        networks:
            - backend-network
            - frontend-network

    queue:
        image: mpesa_middleware:1.0
        container_name: mpesa_queue
        restart: always
        command:
            - php
            - artisan
            - queue:work
            - --sleep=3
            - --tries=3
            - --max-time=3600
        volumes:
            - storage_data:/var/www/html/storage
            - /opt/devyanivbl/.env:/var/www/html/.env:ro
        depends_on:
            app:
                condition: service_healthy
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f 'queue:work' || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 5s
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        networks:
            - frontend-network
            - backend-network

    redis:
        image: redis:7-alpine
        container_name: redis
        restart: always
        command: redis-server --requirepass "${REDIS_PASSWORD}"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep PONG"]
            interval: 5s
            timeout: 3s
            retries: 5
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        networks:
            - backend-network

    postgres:
        image: postgres:18-alpine3.24
        container_name: postgres
        restart: always
        shm_size: 256mb
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
            interval: 5s
            timeout: 5s
            retries: 5
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        networks:
            - backend-network

    webserver:
        image: nginx:1.31.5-alpine
        container_name: nginx
        restart: always
        ports:
            - "80:80"
            - "443:443"
        environment:
          APP_SERVER_NAME: ${SERVER_NAME}
        volumes:
            - ./public:/var/www/html/public:ro
            - ./docker/nginx/certs:/etc/nginx/certs:ro
            - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test:
              ["CMD-SHELL", "wget --no-verbose --tries=1 --spider --header=\"Host: ${SERVER_NAME}\" --no-check-certificate https://127.0.0.1/nginx-health || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 5s
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        networks:
            - frontend-network

    portainer:
        image: portainer/portainer-ce:2.27.0
        container_name: portainer
        restart: always
        command: --base-url /portainer
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - portainer_data:/data
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        networks:
            - frontend-network

networks:
    frontend-network:
        driver: bridge

    backend-network:
        driver: bridge
        internal: true

volumes:
    storage_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /var/log/application/devyanivbl/storage

    redis_data:
    postgres_data:
    portainer_data:
