services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: mpesa_middleware:1.0
        container_name: mpesa_middleware
        restart: always
        environment:
            DB_PORT: ${DB_PORT:-5432}
            DB_HOST: ${DB_HOST:-postgres}
            APP_ENV: ${APP_ENV:-production}
            APP_DEBUG: ${APP_DEBUG:-"false"}
            DB_DATABASE: ${DB_DATABASE:-mpesa}
            DB_USERNAME: ${DB_USERNAME:-mpesa}
            DB_PASSWORD: ${DB_PASSWORD:-secret}
            DB_CONNECTION: ${DB_CONNECTION:-pgsql}
        volumes:
            - storage_data:/var/www/html/storage
            - /opt/devyanivbl/.env:/var/www/html/.env:ro
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - app-network

    scheduler:
        image: mpesa_middleware:1.0
        container_name: mpesa_scheduler
        restart: always
        command: ["php", "artisan", "schedule:work"]
        volumes:
            - storage_data:/var/www/html/storage
            - /opt/devyanivbl/.env:/var/www/html/.env:ro
        depends_on:
            - app
            - postgres
        networks:
            - app-network

    postgres:
        image: postgres:18-alpine3.24
        container_name: postgres
        restart: always
        environment:
            POSTGRES_DB: ${DB_DATABASE:-mpesa}
            POSTGRES_USER: ${DB_USERNAME:-mpesa}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mpesa} -d ${DB_DATABASE:-mpesa}"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - app-network

    webserver:
        image: nginx:1.31.5-alpine
        container_name: nginx
        restart: always
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./docker/nginx/certs:/etc/nginx/certs:ro
        depends_on:
            - app
        networks:
            - app-network

networks:
    app-network:
        driver: bridge

volumes:
    storage_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /var/log/application/devyanivbl/storage
    postgres_data:

